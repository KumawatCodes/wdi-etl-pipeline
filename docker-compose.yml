services:
  postgres:
    image: postgres:17
    container_name: wdi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wdi_user
      POSTGRES_PASSWORD: wdi_pass
      POSTGRES_DB: wdi_db
    ports:
      - "5432:5432"
    volumes:
      - wdi_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  wdi_pgdata: